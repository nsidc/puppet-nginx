version: 2

jobs:
  test-puppet8: &test_setup
    working_directory: ~/puppet-nsidc-jenkins
    docker:
      - image: ruby:3.4-bookworm
        environment:
          BUNDLE_GEMFILE: Gemfile8
    steps:
      - run:
          name: Install git
          command: apt-get install -y git
      - checkout
      - run:
          name: Install RubyGem dependencies
          command: bundle install --path=vendor/bundle --jobs=4 --retry=3
      - run:
          name: Linter and Parser
          command: bundle exec rake lint
      - run:
          name: Run metadata_lint, release_checks.
          command: bundle exec rake test

workflows:
  version: 2
  test-workflow:
    jobs:
      - test-puppet8
